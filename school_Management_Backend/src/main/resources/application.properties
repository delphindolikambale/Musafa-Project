spring.application.name=school_Management_Backend

# 1. Connexion a la base de donnees
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_management_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:musafa}

# 2. Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Strategie de generation des tables (Hibernate)
# \uD83D\uDD25 CORRECTION : Force explicitement Spring Data JPA \u00E0 g\u00E9n\u00E9rer les tables manquantes
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# 4. Affichage des requetes SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Dialecte SQL pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springdoc=DEBUG

# La cle de securite pour les badges (Tokens)
school.app.jwtSecret=${JWT_SECRET:CeciEstUneCleTresLongueEtSecuriseePourLeSystemeDeGestionScolaireMUSAFA2026}
# Expiration : 24 heures
school.app.jwtExpirationMs=86400000

# Gestion des fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# \u2705 AJOUT : Configuration SMTP pour l'envoi d'e-mails (Activation SaaS)
# RAPPEL : Remplacez par les vrais acc\u00E8s de l'email officiel du syst\u00E8me
# =========================================================================
# R\u00E9cup\u00E9ration dynamique des variables d'environnement d\u00E9finies sur Render
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:default_user}
spring.mail.password=${SMTP_PASSWORD:default_password}

# Propri\u00E9t\u00E9s additionnelles pour s\u00E9curiser la connexion (TLS/SSL)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

